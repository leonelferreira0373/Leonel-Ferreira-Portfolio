<!doctype html>
<html lang="pt-PT" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Leonel Ferreira — Programador e Designer Gráfico fluente em Inglês e Português. Criador de +10 websites, +5 apps e +100 projetos de design. Gerente na Geosstore."
    />
    <meta property="og:title" content="Leonel Ferreira — Programador, Designer Gráfico & Gerente @ Geosstore" />
    <meta
      property="og:description"
      content="Programador e Designer Gráfico fluente em Inglês e Português. Criei +10 websites, +5 apps e +100 projetos de Design Gráfico para +5 clientes. Atualmente Gerente na Geosstore."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://leonelferreira.vercel.app/og-image.jpg" />
    <title>Leonel Ferreira — Programador & Designer</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark") document.documentElement.classList.add("dark");
          var l = localStorage.getItem("lang");
          if (l === "en") document.documentElement.lang = "en";
        } catch (e) {}
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
